name: CI/CD Pipeline (FastAPI)

on:
    push:
        branches: ["main", "develop"]

jobs:
    # 1. 빌드 및 이미지 푸시
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  # Secrets 매칭: DOCKER_HUB_USERNAME / DOCKER_HUB_PASSWORD
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  # AI 전용 이미지 태그
                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/banolim-ai:latest

    # 2. 서버 배포
    deploy:
        needs: build-and-push
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: SSH Remote Commands
              uses: appleboy/ssh-action@master
              with:
                  # Secrets 매칭: SERVER_IP / SERVER_USER / SSH_PRIVATE_KEY
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      # 1. 인프라 레포 폴더로 이동 (실제 서버 경로로 수정하세요)
                      cd ~/banolim-infra

                      # 2. 최신 docker-compose.yml 반영을 위해 pull
                      git pull origin main

                      # 3. 도커 허브 로그인
                      echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

                      # 4. FastAPI 구동에 필요한 환경변수 주입
                      export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
                      export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
                      export CHATBOT_ELEVENLABS_API_KEY=${{ secrets.CHATBOT_ELEVENLABS_API_KEY }}
                      export SENTENCE_ELEVENLABS_API_KEY=${{ secrets.SENTENCE_ELEVENLABS_API_KEY }}
                      export WORDBOOK_OPENAI_API_KEY=${{ secrets.WORDBOOK_OPENAI_API_KEY }}
                      export CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}

                      # 5. FastAPI 컨테이너 업데이트 (서비스 이름이 fastapi-ai가 맞는지 확인!)
                      docker compose pull fastapi-ai
                      docker compose up -d fastapi-ai

                      # 6. 오래된 이미지 정리
                      docker image prune -f
