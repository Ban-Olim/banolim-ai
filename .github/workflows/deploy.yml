name: Banolim FastAPI CI (Build & Push)

on:
    push:
        branches: ["main", "develop"]

jobs:
    # 1. CI 단계: 빌드 및 도커 허브 이미지 푸시
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true

                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/banolim-ai:latest

    # 2. 인프라 레포에 배포 신호 보내기
    trigger-infra:
        needs: build-and-push
        if: github.ref == 'refs/heads/main' # main 브랜치일 때만 인프라 레포 호출
        runs-on: ubuntu-latest
        steps:
            - name: Repository Dispatch
              uses: peter-evans/repository-dispatch@v2
              with:
                  # 인프라 레포 접근 권한이 있는 Personal Access Token
                  token: ${{ secrets.GH_PAT }}
                  repository: Ban-Olim/banolim-infra
                  event-type: deploy-signal
                  client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "module": "fastapi"}'
